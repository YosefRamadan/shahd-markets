name = "shahd-markets"
compatibility_date = "2026-06-09"
pages_build_output_dir = "./.output/public"
send_metrics = false

# This is a Cloudflare Pages configuration file.
# Do not add `main` or `[assets]` here just to satisfy `wrangler deploy`:
# `wrangler deploy` deploys Workers, not Pages, and will fail or target the
# wrong product for this app. Use one of these instead:
#   bun run deploy:cloudflare
#   bunx wrangler pages deploy .output/public --project-name shahd-markets
#
# Configure environment variables and secrets in the Cloudflare Pages dashboard
# or with `wrangler pages secret put` / Pages project settings. See
# .env.example and CLOUDFLARE.md for the required Supabase bindings.

[vars]
# Public Supabase values are safe to expose to the browser. Set matching
# production values in the Cloudflare Pages dashboard as well.
VITE_SUPABASE_URL = "https://your-project.supabase.co"
VITE_SUPABASE_PROJECT_ID = "your-project-ref"
VITE_SUPABASE_PUBLISHABLE_KEY = "your-supabase-anon-or-publishable-key"
SUPABASE_URL = "https://your-project.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "your-supabase-anon-or-publishable-key"

# Secrets must be configured with Wrangler or in the Cloudflare dashboard:
# wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY
